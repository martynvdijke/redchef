services:
  redchef:
    build: .
    ports:
      - "6270:6270"
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      PORT: "6270"
      DB_PATH: /app/redchef.db
    volumes:
      - redchef_uploads:/app/uploads
      - redchef_data:/app/data

volumes:
  redchef_uploads:
  redchef_data:
