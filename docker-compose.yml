services:
  redchef:
    build: .
    ports:
      - "6270:6270"
    environment:
      PORT: "6270"
      DB_PATH: /db/redchef.db
      UPLOAD_DIR: /app/media
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://authelia.vandijke.xyz}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-redchef}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-https://redchef.vandijke.xyz/api/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile groups}
      OIDC_LOGOUT_URL: ${OIDC_LOGOUT_URL:-}
      # OpenTelemetry: unset endpoint keeps telemetry disabled.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-redchef}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
    volumes:
      - redchef_media:/app/media
      - redchef_db:/db

volumes:
  redchef_media:
  redchef_db:
