plugins:
  - [
      "@semantic-release/commit-analyzer",
      {
        "releaseRules": [
          { "type": "chore", "scope": "deps", "release": "patch" },
          { "type": "chore", "scope": "dependencies", "release": "patch" },
          { "type": "refactor", "release": "patch" },
          { "type": "style", "release": "patch" }
        ]
      }
    ]
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - [
      "@semantic-release/exec",
      {
        prepareCmd: "VERSION='${nextRelease.version}' && CODE=$(echo \"$VERSION\" | awk -F. '{printf \"%d%03d%03d\", $1, $2, $3}') && sed -i 's/\"version\": \".*\"/\"version\": \"${nextRelease.version}\"/' package.json && sed -i 's/var Version = \".*\"/var Version = \"${nextRelease.version}\"/' main.go && if [ -f mobile/pubspec.yaml ]; then sed -i \"s/^version: .*/version: $VERSION+$CODE/\" mobile/pubspec.yaml; fi"
      }
    ]
  - [
      "@semantic-release/git",
      {
        message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
        assets: ["CHANGELOG.md", "package.json", "main.go", "mobile/pubspec.yaml"],
      },
    ]
  - "@semantic-release/github"

branches:
  - main
