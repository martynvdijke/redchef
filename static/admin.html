<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedChef — Admin</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <style>
    /* Admin-specific styles */
    body { background: #111; }

    .login-section {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .login-box {
      background: var(--black-light);
      border: 2px solid #333;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box .chef-icon {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }

    .login-box h1 {
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
    }

    .login-box .subtitle {
      color: var(--gray);
      font-size: 0.85rem;
      margin-bottom: 2rem;
      font-style: italic;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gray);
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: var(--white);
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-primary:hover {
      background: var(--red-dark);
    }

    .login-error {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.5rem;
    }

    /* Dashboard */
    .dashboard {
      display: none;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--red);
    }

    .dashboard-header h1 {
      font-size: 1.4rem;
    }

    .btn-danger {
      padding: 10px 20px;
      background: transparent;
      color: var(--red);
      border: 2px solid var(--red);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-danger:hover {
      background: var(--red);
      color: white;
    }

    .upload-section {
      background: var(--black-light);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .upload-section h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-row .full {
      grid-column: 1 / -1;
    }

    .upload-progress {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--copper));
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.8rem;
      color: var(--gray);
      white-space: nowrap;
      min-width: 60px;
      text-align: right;
    }

    .upload-status {
      margin-top: 1rem;
      font-size: 0.85rem;
      min-height: 1.5rem;
    }

    /* Posts table */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .admin-table th {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 2px solid var(--red);
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.75rem;
    }

    .admin-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #222;
      vertical-align: middle;
    }

    .admin-table tr:hover td {
      background: rgba(255,255,255,0.02);
    }

    .type-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .type-photo { background: rgba(212,43,43,0.2); color: var(--red); }
    .type-video { background: rgba(245,197,24,0.2); color: var(--gold); }

    .delete-btn {
      padding: 6px 14px;
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: var(--red);
      color: white;
    }

    .lock-btn {
      padding: 4px 10px;
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-left: 6px;
    }

    .lock-btn:hover {
      background: var(--gold);
      color: #111;
    }

    .lock-status {
      font-size: 0.85rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 1rem;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--gold);
    }

    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--gray);
    }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div class="login-section" id="login-section">
    <div class="login-box">
      <div class="chef-icon">👨‍🍳</div>
      <h1>Red Copper Chef</h1>
      <p class="subtitle">Admin Access — For The Chef's Inner Circle</p>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div class="dashboard" id="dashboard-section">
    <div class="dashboard-header">
      <h1>👨‍🍳 Red Copper Chef — Content Studio</h1>
      <button class="btn-danger" id="logout-btn">Logout</button>
    </div>

    <!-- Upload Form -->
    <div class="upload-section">
      <h2>📤 Upload New Content</h2>
      <form id="upload-form">
        <div class="form-row">
          <div class="full form-group">
            <label>Title</label>
            <input type="text" name="title" placeholder="e.g. My Latest Masterpiece" required>
          </div>
          <div class="full form-group">
            <label>Description</label>
            <textarea name="description" rows="2" placeholder="Describe this culinary triumph..."></textarea>
          </div>
          <div class="form-group">
            <label>Media File</label>
            <input type="file" name="file" accept="image/*,video/*" required style="color:var(--gray);font-size:0.85rem;padding:8px 0;">
          </div>
          <div class="form-group">
            <label>&nbsp;</label>
            <div class="checkbox-group">
              <input type="checkbox" name="locked" id="locked" value="true" checked>
              <label for="locked">Lock behind paywall ($0.05)</label>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:1rem;" id="upload-btn">Upload</button>
        <div class="upload-progress" id="upload-progress" style="display:none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-text" id="progress-text">Uploading...</div>
        </div>
        <div class="upload-status" id="upload-status"></div>
      </form>
    </div>

    <!-- Analytics Settings -->
    <div class="upload-section" id="settings-section">
      <h2>⚙️ Analytics Settings</h2>
      <form id="settings-form">
        <div class="form-row">
          <div class="full form-group">
            <div class="checkbox-group" style="margin-top:0;">
              <input type="checkbox" name="tracking_enabled" id="tracking-enabled" value="true">
              <label for="tracking-enabled">Enable Umami Analytics</label>
            </div>
          </div>
          <div class="form-group">
            <label>Umami Script URL</label>
            <input type="url" name="umami_script_url" id="umami-script-url" placeholder="https://analytics.example.com/script.js">
          </div>
          <div class="form-group">
            <label>Website ID</label>
            <input type="text" name="umami_website_id" id="umami-website-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
          </div>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:1rem;background:var(--copper);">Save Settings</button>
        <div class="upload-status" id="settings-status"></div>
      </form>
    </div>

    <!-- Posts Table -->
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Preview</th>
            <th>Title</th>
            <th>Type</th>
            <th>Locked</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="posts-table-body">
          <tr><td colspan="6" style="text-align:center;padding:2rem;color:#888;">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Users Section -->
    <div class="upload-section" id="users-section" style="margin-top:2rem;">
      <h2>👥 User Management</h2>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Role</th>
              <th>Paid</th>
              <th>Joined</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-table-body">
            <tr><td colspan="5" style="text-align:center;padding:2rem;color:#888;">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
