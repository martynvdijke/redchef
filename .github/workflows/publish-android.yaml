name: Publish Android Release

# Recovery path: builds and attaches the signed APK for an existing release tag
# and publishes the matching AAB to Google Play when semantic-release created
# the tag but the release pipeline could not finish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version whose v<version> tag is present
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; release APK will be debug-signed."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/upload-keystore.jks
          cat > mobile/android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/mobile/android/upload-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Verify APK contains MainActivity
        run: |
          set -euo pipefail
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          rm -rf /tmp/apkdex && mkdir -p /tmp/apkdex
          unzip -q "$APK" 'classes*.dex' -d /tmp/apkdex
          if ! grep -aq "xyz/vandijke/redchef/MainActivity" /tmp/apkdex/classes*.dex; then
            echo "::error::Release APK is missing xyz.vandijke.redchef.MainActivity; it would crash on launch."
            exit 1
          fi

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "redchef-${VERSION}-android.apk"
          gh release upload "v${VERSION}" "redchef-${VERSION}-android.apk" --clobber

  play-store:
    name: Publish to Play Store
    needs: apk
    uses: ./.github/workflows/play-store.yaml
    secrets: inherit
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}
